# WinMojo's toolchain configuration. SHIPPED AS-IS AND NEVER REWRITTEN.
#
# The compiler finds this file from its own executable's location, and
# `@ROOT@` below expands to the directory this file is in. So a tree can be
# unpacked anywhere -- another drive, a memory stick, an MSIX package whose
# path changes on every update -- and this file is right without anyone
# touching it. No path in here names a drive, and the release fails to build
# if one does.
#
# Every *_path the compiler has a default for is OMITTED: bin\mojo.exe,
# lib\std.mojoc, lib\windows_api.db, lib\KGENCompilerRTShared.dll and the
# rest are exactly where it looks when no path is given. Only the keys with no
# default appear.

[mojo-max]
import_path = @ROOT@\lib
linker_driver = @ROOT@\bin\lld-link.exe
shared_libs = @ROOT@\lib\nvptxrt.dll,@ROOT@\lib\AsyncRTRuntimeGlobals.dll,@ROOT@\lib\MSupportGlobals.dll
system_libs = kernel32.lib,vcruntime.lib,ucrt.lib

[crash_reporting]
handler_path = @ROOT@\bin\modular-crashpad-handler.exe
